packages:
  - apps/*

# Refuse installs on a Node version outside the root package's `engines`.
engineStrict: true

# Versions shared by the apps; a package references one as "catalog:".
catalog:
  '@tanstack/react-query': ^5.108.4
  next: ^16.4.6
  openapi-zod-client: ^1.18.3
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^6.0.3
  zod: ^4.6.7

# Dependencies allowed to run install scripts; every other build script stays blocked.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  # Usage telemetry pulled in by swagger-ui-dist; never run it.
  '@scarf/scarf': false
